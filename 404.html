<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ERRO 404 - DRAMEI APP</title>
  <link rel="icon" href="/img/favicon.png">
  <style>
    :root {
      --bg: #12012A;
      --text: #f2f2f2;
      --muted: #8a8a93;
      --accent: #e5e5e5;
      --btn-bg: #e5e5e5;
      --btn-bg-hover: #ffffff;
      --btn-text: #0d0d0f;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      padding: 2rem;
      text-align: center;
    }

    .logo {
      width: min(70vw, 600px);
      object-fit: contain;
    }

    .links {
      list-style: none;
      width: 100%;
      max-width: 320px; /* ajuste esse valor para mudar o tamanho do botão */
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
      padding: 0.9rem 1.1rem;
      background: var(--btn-bg);
      color: var(--btn-text);
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      border-radius: 14px;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .btn:hover {
      background: var(--btn-bg-hover);
      transform: translateY(-2px);
    }

    .btn img {
      width: 28px;
      height: 28px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .btn span {
      min-width: 0;
      overflow-wrap: anywhere;
      text-align: left;
    }
  </style>
</head>
<body>
  <img class="logo" src="/img/404.png" alt="Logo">
  <ul class="links">
    <li><a class="btn" href="https://dramei.app"><img src="/img/icon_app.png" alt=""><span>VOLTAR AO SITE</span></a></li>
  </ul>
</body>
</html>
